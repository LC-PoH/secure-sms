{% extends 'base.html' %}
{% block title %}500 Server Error{% endblock %}
{% block content %}
<div class="text-center mt-5">
  <i class="bi bi-exclamation-octagon text-danger" style="font-size:5rem;"></i>
  <h2 class="mt-3">500 — Internal Server Error</h2>
  <p class="text-muted">An unexpected error occurred. The error has been logged. Please try again later.</p>
  <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
