{% extends 'base.html' %}
{% block title %}429 Rate Limited{% endblock %}
{% block content %}
<div class="text-center mt-5">
  <i class="bi bi-speedometer2 text-warning" style="font-size:5rem;"></i>
  <h2 class="mt-3">429 — Too Many Requests</h2>
  <p class="text-muted">You have exceeded the rate limit. Please wait before trying again.</p>
  <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary mt-3">Back to Login</a>
</div>
{% endblock %}
